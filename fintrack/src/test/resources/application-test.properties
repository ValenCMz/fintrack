# Test profile. Las 8 variables de application.properties que no tienen default:
# sin estas el contexto de Spring no arranca.
#
# URL_DB / USERNAME_DB / PASSWORD_DB los sobreescribe Testcontainers en tiempo de
# ejecucion via @DynamicPropertySource, asi que los valores de abajo son placeholders.

URL_DB=jdbc:postgresql://localhost:5432/fintrack_test
USERNAME_DB=postgres
PASSWORD_DB=postgres

# Base64 de 32 bytes. JwtService falla al arrancar con una clave invalida, asi que
# tiene que ser valida de verdad, no un placeholder cualquiera.
JWT_SECRET=dGhpcy1pcy1hLXRlc3Qtc2VjcmV0LWtleS1mb3Itand0LXRlc3Rpbmc=

MAIL_HOST=localhost
MAIL_PORT=3025
MAIL_USERNAME=test
MAIL_PASSWORD=test

DDL_AUTO=create-drop
SHOW_SQL=false

# Los tests no ejercitan las migraciones Flyway: Hibernate arma el esquema
# efimero con create-drop. Flyway se usa solo en runtime (perfil default).
spring.flyway.enabled=false

# Las pruebas no mandan mails reales; el host de arriba es un catcher SMTP.
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
